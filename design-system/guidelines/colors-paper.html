<!-- @dsCard group="Colors" viewport="700x200" subtitle="Everything printed on a sheet" name="Paper & ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Paper & ink</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div class="sw"><div class="s"><i style="background:var(--pv-paper)"></i><b>Paper</b><span>--pv-paper</span><span data-v="--pv-paper"></span></div><div class="s"><i style="background:var(--pv-paper-under)"></i><b>Under-sheet</b><span>--pv-paper-under</span><span data-v="--pv-paper-under"></span></div><div class="s"><i style="background:var(--pv-ink)"></i><b>Ink</b><span>--pv-ink</span><span data-v="--pv-ink"></span></div><div class="s"><i style="background:var(--pv-ink-2)"></i><b>Ink 2</b><span>--pv-ink-2</span><span data-v="--pv-ink-2"></span></div><div class="s"><i style="background:var(--pv-ink-muted)"></i><b>Ink muted</b><span>--pv-ink-muted</span><span data-v="--pv-ink-muted"></span></div><div class="s"><i style="background:var(--pv-ink-meta)"></i><b>Running head</b><span>--pv-ink-meta</span><span data-v="--pv-ink-meta"></span></div><div class="s"><i style="background:var(--pv-ink-accent)"></i><b>Ink accent</b><span>--pv-ink-accent</span><span data-v="--pv-ink-accent"></span></div><div class="s"><i style="background:var(--pv-ink-rule)"></i><b>Rule</b><span>--pv-ink-rule</span><span data-v="--pv-ink-rule"></span></div><div class="s"><i style="background:var(--pv-ink-rule-accent)"></i><b>Kind rule</b><span>--pv-ink-rule-accent</span><span data-v="--pv-ink-rule-accent"></span></div><div class="s"><i style="background:var(--pv-ink-link-underline)"></i><b>Link underline</b><span>--pv-ink-link-underline</span><span data-v="--pv-ink-link-underline"></span></div><div class="s"><i style="background:var(--pv-ink-chip)"></i><b>Chip</b><span>--pv-ink-chip</span><span data-v="--pv-ink-chip"></span></div><div class="s"><i style="background:var(--pv-ink-tint)"></i><b>Note tint</b><span>--pv-ink-tint</span><span data-v="--pv-ink-tint"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
