<!-- @dsCard group="Colors" viewport="700x200" subtitle="Window UI surfaces and lines, daylight" name="Chrome surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Chrome surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div class="sw"><div class="s"><i style="background:var(--pv-chrome)"></i><b>Chrome</b><span>--pv-chrome</span><span data-v="--pv-chrome"></span></div><div class="s"><i style="background:var(--pv-chrome-raised)"></i><b>Raised</b><span>--pv-chrome-raised</span><span data-v="--pv-chrome-raised"></span></div><div class="s"><i style="background:var(--pv-desk)"></i><b>Desk</b><span>--pv-desk</span><span data-v="--pv-desk"></span></div><div class="s"><i style="background:var(--pv-field)"></i><b>Field</b><span>--pv-field</span><span data-v="--pv-field"></span></div><div class="s"><i style="background:var(--pv-selected)"></i><b>Selected</b><span>--pv-selected</span><span data-v="--pv-selected"></span></div><div class="s"><i style="background:var(--pv-pressed)"></i><b>Pressed</b><span>--pv-pressed</span><span data-v="--pv-pressed"></span></div><div class="s"><i style="background:var(--pv-line)"></i><b>Line</b><span>--pv-line</span><span data-v="--pv-line"></span></div><div class="s"><i style="background:var(--pv-line-strong)"></i><b>Line strong</b><span>--pv-line-strong</span><span data-v="--pv-line-strong"></span></div><div class="s"><i style="background:var(--pv-divider)"></i><b>Divider</b><span>--pv-divider</span><span data-v="--pv-divider"></span></div><div class="s"><i style="background:var(--pv-empty)"></i><b>Empty / disabled</b><span>--pv-empty</span><span data-v="--pv-empty"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
