<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Paper on the desk" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="background:var(--pv-desk);padding:24px;display:flex;gap:22px;margin:-20px"><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:100px;height:70px;background:var(--pv-paper);box-shadow:var(--pv-shadow-sheet)"></span><b style="color:var(--pv-text)">Sheet / note</b>--pv-shadow-sheet</div><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:100px;height:70px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">Project card</b>--pv-shadow-card</div><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:100px;height:70px;background:var(--pv-paper);box-shadow:var(--pv-shadow-slip)"></span><b style="color:var(--pv-text)">Slip</b>--pv-shadow-slip</div><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:100px;height:70px;background:var(--pv-paper);box-shadow:var(--pv-shadow-field)"></span><b style="color:var(--pv-text)">Quick add</b>--pv-shadow-field</div><div style="display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:100px;height:70px;background:var(--pv-paper);box-shadow:var(--pv-shadow-bar)"></span><b style="color:var(--pv-text)">Floating bar</b>--pv-shadow-bar</div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
