<!-- @dsCard group="Type" viewport="700x170" subtitle="UI headings, one weight" name="Heading — Young Serif" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Heading — Young Serif</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="font:52px/1.08 var(--pv-font-heading);color:var(--pv-text)">Good evening.</div><div style="display:flex;gap:28px;align-items:baseline;margin-top:14px;color:var(--pv-text)"><span style="font:30px var(--pv-font-heading)">Ana Novak</span><span style="font:22px var(--pv-font-heading)">Appearance</span><span style="font:16px var(--pv-font-heading)">Doing</span><span style="font:15px var(--pv-font-heading)">Chapters</span></div><div style="font-size:11px;color:var(--pv-text-faint);margin-top:10px">--pv-font-heading · 52 / 30 / 22 / 21 / 16 / 15 · weight 400 only</div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
