<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Small and quiet; paper is square" name="Radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:flex;gap:22px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:0;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">0</b>Paper, slips</div><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:3px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">3px</b>Tools, rows, chips</div><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:4px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">4px</b>Buttons, segmented</div><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:5px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">5px</b>Floating bar</div><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:6px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">6px</b>Window</div><div style="display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--pv-text-subtle)"><span style="width:76px;height:56px;border-radius:999px;background:var(--pv-paper);box-shadow:var(--pv-shadow-card)"></span><b style="color:var(--pv-text)">999px</b>Toggle only</div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
