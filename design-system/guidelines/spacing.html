<!-- @dsCard group="Spacing" viewport="700x150" subtitle="--pv-space-1 … 14" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:flex;align-items:flex-end;gap:12px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:2px;height:2px;background:var(--pv-accent);opacity:.85"></span>2<span style="font-size:9.5px">1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:4px;height:4px;background:var(--pv-accent);opacity:.85"></span>4<span style="font-size:9.5px">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:6px;height:6px;background:var(--pv-accent);opacity:.85"></span>6<span style="font-size:9.5px">3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:8px;height:8px;background:var(--pv-accent);opacity:.85"></span>8<span style="font-size:9.5px">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:10px;height:10px;background:var(--pv-accent);opacity:.85"></span>10<span style="font-size:9.5px">5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:12px;height:12px;background:var(--pv-accent);opacity:.85"></span>12<span style="font-size:9.5px">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:14px;height:14px;background:var(--pv-accent);opacity:.85"></span>14<span style="font-size:9.5px">7</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:16px;height:16px;background:var(--pv-accent);opacity:.85"></span>16<span style="font-size:9.5px">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:18px;height:18px;background:var(--pv-accent);opacity:.85"></span>18<span style="font-size:9.5px">9</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:22px;height:22px;background:var(--pv-accent);opacity:.85"></span>22<span style="font-size:9.5px">10</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:28px;height:28px;background:var(--pv-accent);opacity:.85"></span>28<span style="font-size:9.5px">11</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:36px;height:36px;background:var(--pv-accent);opacity:.85"></span>36<span style="font-size:9.5px">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:44px;height:44px;background:var(--pv-accent);opacity:.85"></span>44<span style="font-size:9.5px">13</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--pv-text-faint)"><span style="width:64px;height:64px;background:var(--pv-accent);opacity:.85"></span>64<span style="font-size:9.5px">14</span></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
