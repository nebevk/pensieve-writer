<!-- @dsCard group="Type" viewport="700x180" subtitle="Menus, labels, body UI" name="UI — Hanken Grotesk" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>UI — Hanken Grotesk</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:grid;grid-template-columns:110px 1fr;row-gap:8px;align-items:baseline;color:var(--pv-text)">
<span class="lbl" style="margin:0">14 · 400</span><span style="font-size:14px">Decide which key opens the trunk</span>
<span class="lbl" style="margin:0">13.5 · 600</span><span style="font-size:13.5px;font-weight:600">Grandmother's Keys</span>
<span class="lbl" style="margin:0">12.5 · 400</span><span style="font-size:12.5px">Normal text · Write · Outline · Book · Notes</span>
<span class="lbl" style="margin:0">11.5 · 400</span><span style="font-size:11.5px;color:var(--pv-text-faint)">34, restorer in Ljubljana · 1,412 words</span>
<span class="lbl" style="margin:0">10.5 · 600</span><span style="font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint)">Characters · By chapter</span></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
