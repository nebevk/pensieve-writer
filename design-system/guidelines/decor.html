<!-- @dsCard group="Brand" viewport="700x180" subtitle="Home and Settings only" name="Soft circles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Soft circles</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div data-theme="daylight" style="position:relative;overflow:hidden;height:140px;border-radius:4px;background:var(--pv-chrome)"><span style="position:absolute;left:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:var(--pv-decor-2);opacity:.5"></span><span style="position:absolute;left:110px;bottom:56px;width:40px;height:40px;border-radius:50%;background:var(--pv-decor-1);opacity:.6"></span><span style="position:absolute;right:-60px;top:-70px;width:160px;height:160px;border-radius:50%;background:var(--pv-decor-1);opacity:.55"></span><span style="position:absolute;left:14px;top:12px;font:15px var(--pv-font-heading);color:var(--pv-text)">Daylight</span></div><div data-theme="candlelit" style="position:relative;overflow:hidden;height:140px;border-radius:4px;background:var(--pv-chrome)"><span style="position:absolute;left:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:var(--pv-decor-2);opacity:.5"></span><span style="position:absolute;left:110px;bottom:56px;width:40px;height:40px;border-radius:50%;background:var(--pv-decor-1);opacity:.6"></span><span style="position:absolute;right:-60px;top:-70px;width:160px;height:160px;border-radius:50%;background:var(--pv-decor-1);opacity:.55"></span><span style="position:absolute;left:14px;top:12px;font:15px var(--pv-font-heading);color:var(--pv-text)">Candlelit</span></div><div data-theme="moonlit" style="position:relative;overflow:hidden;height:140px;border-radius:4px;background:var(--pv-chrome)"><span style="position:absolute;left:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:var(--pv-decor-2);opacity:.5"></span><span style="position:absolute;left:110px;bottom:56px;width:40px;height:40px;border-radius:50%;background:var(--pv-decor-1);opacity:.6"></span><span style="position:absolute;right:-60px;top:-70px;width:160px;height:160px;border-radius:50%;background:var(--pv-decor-1);opacity:.55"></span><span style="position:absolute;left:14px;top:12px;font:15px var(--pv-font-heading);color:var(--pv-text)">Moonlit</span></div></div><div style="font-size:11px;color:var(--pv-text-faint);margin-top:10px">--pv-decor-1 / --pv-decor-2 · never on Write, Notes or To-dos</div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
