<!-- @dsCard group="Colors" viewport="700x130" subtitle="Terracotta accent, sage success" name="Accent & status" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Accent & status</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div class="sw"><div class="s"><i style="background:var(--pv-accent)"></i><b>Accent</b><span>--pv-accent</span><span data-v="--pv-accent"></span></div><div class="s"><i style="background:var(--pv-accent-solid)"></i><b>Accent solid</b><span>--pv-accent-solid</span><span data-v="--pv-accent-solid"></span></div><div class="s"><i style="background:var(--pv-success)"></i><b>Success</b><span>--pv-success</span><span data-v="--pv-success"></span></div><div class="s"><i style="background:var(--pv-status-final)"></i><b>Final dot</b><span>--pv-status-final</span><span data-v="--pv-status-final"></span></div><div class="s"><i style="background:var(--pv-success-solid)"></i><b>Toggle on</b><span>--pv-success-solid</span><span data-v="--pv-success-solid"></span></div><div class="s"><i style="background:var(--pv-progress)"></i><b>Goal progress</b><span>--pv-progress</span><span data-v="--pv-progress"></span></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
