<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Fixed sizes of the window parts" name="Chrome dimensions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Chrome dimensions</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 20px;color:var(--pv-text)"><div><div style="font:20px var(--pv-font-heading)">34px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Title bar</div></div><div><div style="font:20px var(--pv-font-heading)">40px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Toolbar</div></div><div><div style="font:20px var(--pv-font-heading)">28 × 26</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Tool button</div></div><div><div style="font:20px var(--pv-font-heading)">30px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Floating bar</div></div><div><div style="font:20px var(--pv-font-heading)">232px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Chapter sidebar</div></div><div><div style="font:20px var(--pv-font-heading)">260px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Notes sidebar</div></div><div><div style="font:20px var(--pv-font-heading)">250px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Context column</div></div><div><div style="font:20px var(--pv-font-heading)">200px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Settings nav</div></div><div><div style="font:20px var(--pv-font-heading)">520px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Page narrow</div></div><div><div style="font:20px var(--pv-font-heading)">600px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Page book</div></div><div><div style="font:20px var(--pv-font-heading)">720px</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Page wide</div></div><div><div style="font:20px var(--pv-font-heading)">44 / 76</div><div style="font-size:11.5px;color:var(--pv-text-faint)">Page padding</div></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
