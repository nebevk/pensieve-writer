<!-- @dsCard group="Type" viewport="700x120" subtitle="Settings → Manuscript font" name="Manuscript options" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Manuscript options</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:flex;gap:30px;color:var(--pv-text)"><div><div style="font:30px var(--pv-font-manuscript)">Aa Keys</div><div class="lbl" style="margin-top:6px">Literata · default</div></div><div><div style="font:32px var(--pv-font-garamond)">Aa Keys</div><div class="lbl" style="margin-top:6px">EB Garamond</div></div><div><div style="font:26px var(--pv-font-typewriter)">Aa Keys</div><div class="lbl" style="margin-top:6px">Typewriter (system mono)</div></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
