<!-- @dsCard group="Brand" viewport="700x140" subtitle="The P square and wordmark, set in type" name="Mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mark</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;box-sizing:border-box;font-family:var(--pv-font-ui);background:var(--pv-chrome)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.s{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--pv-text-subtle)}
.s i{display:block;height:44px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.s b{font-weight:600;color:var(--pv-text);font-size:11.5px}
.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}
</style></head><body><div style="display:flex;gap:40px;align-items:center"><div data-theme="daylight" style="background:var(--pv-chrome);padding:18px 22px;border-radius:4px;display:flex;align-items:center;gap:12px"><span style="width:26px;height:26px;border-radius:3px;background:var(--pv-mark-bg);color:var(--pv-mark-fg);display:grid;place-items:center;font:17px/1 var(--pv-font-heading)">P</span><span style="font:19px var(--pv-font-heading);color:var(--pv-text)">Pensieve</span></div><div data-theme="candlelit" style="background:var(--pv-chrome);padding:18px 22px;border-radius:4px;display:flex;align-items:center;gap:12px"><span style="width:26px;height:26px;border-radius:3px;background:var(--pv-mark-bg);color:var(--pv-mark-fg);display:grid;place-items:center;font:17px/1 var(--pv-font-heading)">P</span><span style="font:19px var(--pv-font-heading);color:var(--pv-text)">Pensieve</span></div><div data-theme="moonlit" style="background:var(--pv-chrome);padding:18px 22px;border-radius:4px;display:flex;align-items:center;gap:12px"><span style="width:26px;height:26px;border-radius:3px;background:var(--pv-mark-bg);color:var(--pv-mark-fg);display:grid;place-items:center;font:17px/1 var(--pv-font-heading)">P</span><span style="font:19px var(--pv-font-heading);color:var(--pv-text)">Pensieve</span></div></div><script>document.querySelectorAll('[data-v]').forEach(function(e){var s=getComputedStyle(e.closest('[data-theme]')||document.documentElement);e.textContent=s.getPropertyValue(e.dataset.v).trim();});</script></body></html>
