<!-- @dsCard group="Pensieve desktop" viewport="1280x800" name="Desktop app" subtitle="Home, Write, Notes, To-dos, Settings in three themes" -->
<!DOCTYPE html>
<html data-theme="daylight"><head><meta charset="utf-8"><title>Pensieve — desktop UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>html,body{height:100%}body{background:var(--pv-chrome);overflow:hidden}#root{width:1280px;height:800px}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="data.js"></script>
<script type="text/babel" src="screens.js"></script>
<script type="text/babel">
PensieveDS.ready.then((P) => {
  const { HomeScreen, WriteScreen, NotesScreen, TodosScreen, SettingsWindow, PlaceholderScreen } = window.PvScreens(P);
  const { TitleBar, Toolbar } = P;
  function App() {
    const saved = JSON.parse(localStorage.getItem('pv-kit') || '{}');
    const [theme, setTheme] = React.useState(saved.theme || 'daylight');
    const [screen, setScreen] = React.useState(saved.screen || 'home');
    const [view, setView] = React.useState(saved.view || 'Write');
    const [pane, setPane] = React.useState('notes');
    const [tools, setTools] = React.useState(false);
    const [settings, setSettings] = React.useState(false);
    const [zen, setZen] = React.useState(false);
    React.useEffect(() => {
      const t = theme === 'sunset' ? (new Date().getHours() >= 19 || new Date().getHours() < 7 ? 'candlelit' : 'daylight') : theme;
      document.documentElement.dataset.theme = t;
      localStorage.setItem('pv-kit', JSON.stringify({ theme, screen, view }));
    }, [theme, screen, view]);
    React.useEffect(() => { const k = (e) => { if (e.key === 'Escape') { setZen(false); setSettings(false); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
    const ambience = { daylight: { icon: 'rain', label: 'Rain' }, candlelit: { icon: 'flame', label: 'Fireplace' }, moonlit: { icon: 'rain', label: 'Night rain' } }[document.documentElement.dataset.theme] || { icon: 'rain', label: 'Rain' };
    const openSettings = () => setSettings(true);
    let body;
    if (screen === 'home') body = <HomeScreen onOpen={() => { setScreen('project'); setView('Write'); }} onSettings={openSettings} />;
    else body = (
      <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
        {!zen && <TitleBar project="The Lantern House" view={view} onViewChange={setView} onHome={() => setScreen('home')} onSettings={openSettings} />}
        {!zen && view === 'Write' && <Toolbar expanded={tools} onToggleExpanded={() => setTools(!tools)} active={['bold', 'alignLeft']} />}
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          {view === 'Write' && <WriteScreen zen={zen} onZen={() => setZen(!zen)} ambience={ambience} />}
          {view === 'Notes' && (pane === 'notes' ? <NotesScreen pane={pane} setPane={setPane} /> : <TodosScreen pane={pane} setPane={setPane} />)}
          {(view === 'Outline' || view === 'Book') && <PlaceholderScreen name={view} />}
        </div>
      </div>);
    return (<div style={{ width: 1280, height: 800, position: 'relative', overflow: 'hidden', background: 'var(--pv-chrome)', transition: 'background-color var(--pv-dur-theme) ease' }}>
      {body}
      {settings && <SettingsWindow theme={theme} setTheme={setTheme} onClose={() => setSettings(false)} />}
    </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
