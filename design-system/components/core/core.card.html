<!-- @dsCard group="Components" viewport="700x330" name="Core" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{background:var(--pv-chrome);padding:20px;box-sizing:border-box}.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
PensieveDS.ready.then((P) => {
const {Button, Tag, LangBadge, SavedIndicator, BrandMark, Icon} = P;

const Row = ({ label, children }) => <div style={{ marginBottom: 18 }}><div className="lbl">{label}</div><div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>{children}</div></div>;
function App() { return (<div>
  <Row label="Button"><Button iconRight="arrowRight">Continue writing</Button><Button variant="secondary">Cancel</Button><Button variant="ghost">+ New project</Button><Button size="sm" icon="moon">Zen</Button><Button disabled>Disabled</Button></Row>
  <Row label="Tag (on paper)"><div style={{ background: 'var(--pv-paper)', padding: 10, display: 'flex', gap: 6 }}><Tag>3 · Grandmother's Keys</Tag><Tag kind="note">Ana Novak</Tag><Tag>Whole book</Tag></div></Row>
  <Row label="Status"><BrandMark size={18} /><BrandMark size={26} withName /><SavedIndicator /><SavedIndicator state="saving" /><LangBadge code="EN" /><LangBadge code="SL" /></Row>
  <Row label="Icons">{Icon.names.map((n) => <span key={n} title={n} style={{ color: 'var(--pv-text-2)' }}><Icon name={n} /></span>)}</Row>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
