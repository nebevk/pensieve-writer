<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Home</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{background:var(--pv-chrome);padding:20px;box-sizing:border-box}.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
PensieveDS.ready.then((P) => {
const {ContinueCard, ProjectCard, NewProjectTile, Stat} = P;

function App() { return (<div style={{ display: 'flex', flexDirection: 'column', gap: 26 }}>
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 360px', gap: 28, alignItems: 'center' }}>
    <div style={{ display: 'flex', gap: 32 }}><Stat value={340} of={500} label="words today" /><Stat value={9} label="day streak" /><Stat value={6} label="open to-dos" /></div>
    <ContinueCard height={200} project="The Lantern House" location="Ch. III · p. 47" previous="…as if they had been waiting in the dark for someone to remember them." current={'"Start with the attic," her mother said.'} meta="Edited 2 h ago" />
  </div>
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,minmax(0,1fr))', gap: 20 }}>
    <ProjectCard kind="Novel" title="The Lantern House" progress={0.61} stats="48,930 / 80,000" when="Today" stacked />
    <ProjectCard kind="Kratke zgodbe" title="Zgodbe ob reki" tone="success" progress={0.5} stats="6 of 12 · SL" when="Last week" stacked />
    <ProjectCard kind="Article" title="Why I write by hand first" tone="neutral" progress={1} stats="Final" when="Sept" />
    <NewProjectTile />
  </div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
