<!-- @dsCard group="Components" viewport="700x380" name="Navigation" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../ds-loader.js"></script>
<style>body{background:var(--pv-chrome);padding:20px;box-sizing:border-box}.lbl{font:600 10.5px/1 var(--pv-font-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--pv-text-faint);margin:0 0 10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
PensieveDS.ready.then((P) => {
const {ChapterList, SidebarItem, SectionLabel, AsideList, Segmented, SearchField} = P;

const chapters = [{ title: 'The Letter', status: 'final', words: '3.2k' }, { title: 'Fog on the Sava', status: 'final', words: '2.8k' }, { title: "Grandmother's Keys", status: 'revising', words: '1.4k' }, { title: 'The Attic', status: 'draft', words: '640' }, { status: 'empty', words: '0' }];
function App() {
  const [a, setA] = React.useState(2); const [n, setN] = React.useState(0); const [pane, setPane] = React.useState('notes');
  return (<div style={{ display: 'flex', gap: 0, margin: -20, width: 700, height: 380 }}>
    <ChapterList chapters={chapters} activeIndex={a} onSelect={setA} />
    <div style={{ width: 260, borderRight: '1px solid var(--pv-line)', padding: '16px 12px', display: 'flex', flexDirection: 'column', gap: 2, boxSizing: 'border-box' }}>
      <Segmented block value={pane} onChange={setPane} options={[{ value: 'notes', label: 'Notes', count: 12 }, { value: 'todos', label: 'To-dos', count: 6 }]} />
      <SearchField placeholder="Search notes" style={{ margin: '10px 0 2px' }} />
      <SectionLabel>Characters</SectionLabel>
      {[['Ana Novak', '34, restorer in Ljubljana'], ['Vera, her mother', 'Never goes upstairs'], ['Grandmother Marija', 'Died in March; kept the keys']].map(([t, s], i) => <SidebarItem key={i} title={t} subtitle={s} active={n === i} onClick={() => setN(i)} />)}
    </div>
    <div style={{ flex: 1, padding: '20px 18px', display: 'flex', flexDirection: 'column', gap: 22 }}>
      <AsideList title="Appears in" items={[{ label: '1 · The Letter', value: '14×' }, { label: "3 · Grandmother's Keys", value: '22×' }]} />
      <AsideList title="Linked notes" items={[{ label: 'The Lantern House', link: true }, { label: 'Vera, her mother', link: true }]} />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
