name: CI
# The type check, the tests and the Rust check, on every push to master and on pull requests.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
