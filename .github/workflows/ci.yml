name: CI
# The type check, the tests and the Rust tests, on every push to any branch and on pull requests (ARCH-14).
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
