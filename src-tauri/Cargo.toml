[package]
name = "pensieve"
version = "0.5.4"
description = "A cozy desktop writing app"
edition = "2021"

[lib]
name = "pensieve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2.13.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    # Windows shutting down waits while Pensieve saves (ARCH-23).
    "Win32_System_Shutdown",
    "Win32_UI_WindowsAndMessaging",
    # A deleted project goes to the Recycle Bin (HOME-15).
    "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
